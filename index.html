<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Truss Analysis Solver</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --tension-color: #ef4444;
      --compression-color: #2563eb;
      --zero-color: #94a3b8;
      --accent-color: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      background: var(--panel-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Control Panel */
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
    }

    .preset-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      background-color: #f8fafc;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: #2563eb;
    }

    .preset-question {
      font-size: 0.88rem;
      color: #334155;
      font-style: italic;
      line-height: 1.4;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .checkbox-group {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 18px;
    }

    .checkbox-group input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-reset {
      grid-column: 1 / -1;
      justify-self: start;
      background: #1e293b;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset:hover {
      background: #334155;
    }

    /* SVG Canvas */
    .canvas-container {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Legend */
    .legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .load-arrow-group {
      cursor: grab;
    }

    .load-arrow-group:active {
      cursor: grabbing;
    }

    .member-line {
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }

    .member-label {
      font-size: 11px;
      font-weight: bold;
      fill: #1e293b;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .label-box {
      fill: #ffffff;
      stroke: #cbd5e1;
      stroke-width: 1;
      rx: 3;
    }

    .instruction-tip {
      font-size: 0.8rem;
      color: var(--accent-color);
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Interactive Truss Analysis Solver</h1>
    <p class="subtitle">Select a preset below, or drag the load arrow directly on the canvas.</p>
  </header>

  <!-- Control Panel -->
  <div class="controls">
    <div class="preset-container">
      <label for="presetSelect">Choose Truss Design Preset:</label>
      <select id="presetSelect">
        <option value="0">1. Bridge with Rectangular Segments</option>
        <option value="1">2. Warren Bridge with Triangular Segments</option>
        <option value="2">3. Smaller Scale Warren Bridge</option>
        <option value="3" selected>4. Warren Bridge with Verticals</option>
        <option value="4">5. Full Warren Bridge</option>
        <option value="5">6. Pratt vs. Warren</option>
      </select>
      <p class="preset-question" id="presetQuestion"></p>
    </div>

    <div class="control-group">
      <label for="nodeSelect">Load Position: <span id="nodeVal">Joint B4</span></label>
      <input type="range" id="nodeSelect" min="0" max="6" value="4" step="1">
    </div>

    <div class="control-group">
      <label for="magSelect">Load Magnitude: <span id="magVal">50 kN</span></label>
      <input type="range" id="magSelect" min="0" max="100" value="50" step="5">
    </div>

    <div class="control-group checkbox-group">
      <input type="checkbox" id="toggleValues" checked>
      <label for="toggleValues" style="cursor:pointer;">Show Member Force Values</label>
    </div>

    <button class="btn-reset" id="resetBtn">Reset to Preset Default</button>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" style="background: var(--tension-color);"></div>
      <span>Tension (+)</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background: var(--compression-color);"></div>
      <span>Compression (-)</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background: var(--zero-color);"></div>
      <span>Zero-Force (0)</span>
    </div>
  </div>

  <p class="instruction-tip">💡 Tip: Drag the orange load arrow to reposition or scale force in real-time!</p>

  <!-- SVG Drawing Canvas -->
  <div class="canvas-container">
    <svg id="trussSvg" viewBox="0 0 800 320">
      <defs>
        <!-- Arrowhead Marker -->

        </marker>
      </defs>
      
      <!-- Supports & Grid layer -->
      <g id="supportsGroup"></g>

      <!-- Truss Members Layer -->
      <g id="membersGroup"></g>

      <!-- Labels Layer -->
      <g id="labelsGroup"></g>

      <!-- Joint Nodes Layer -->
      <g id="nodesGroup"></g>

      <!-- Interactive Load Arrow Layer -->
      <g id="loadGroup" class="load-arrow-group"></g>
    </svg>
  </div>
</div>

  // Matrix Structural Solver (2D Direct Stiffness Method)
  function solveTruss(nodes, members, pinIdx, rollerIdx, loadNodeIdx, loadMag) {
    const numNodes = nodes.length;
    const dof = numNodes * 2;
    let K = Array(dof).fill(0).map(() => Array(dof).fill(0));
    let F = Array(dof).fill(0);

    // Downward vertical force (+Y in SVG coords)
    if (loadNodeIdx >= 0 && loadNodeIdx < numNodes) {
      F[loadNodeIdx * 2 + 1] = loadMag; 
    }

    const EA = 1e6;

    members.forEach(m => {
      const n1 = nodes[m.n1];
      const n2 = nodes[m.n2];
      const dx = n2.x - n1.x;
      const dy = n2.y - n1.y;
      const L = Math.hypot(dx, dy);
      if (L === 0) return;
      const c = dx / L;
      const s = dy / L;

      const k_local = [
        [ c*c,  c*s, -c*c, -c*s],
        [ c*s,  s*s, -c*s, -s*s],
        [-c*c, -c*s,  c*c,  c*s],
        [-c*s, -s*s,  c*s,  s*s]
      ];

      const map = [m.n1*2, m.n1*2+1, m.n2*2, m.n2*2+1];
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          K[map[i]][map[j]] += (EA / L) * k_local[i][j];
        }
      }
    });

    // Stabilization term for unstable non-triangulated frames (e.g., Preset 1)
    for (let i = 0; i < dof; i++) {
      K[i][i] += 1e-3;
    }

    // Boundary Conditions: Pin at pinIdx (X,Y), Roller at rollerIdx (Y)
    const fixedDOFs = [pinIdx * 2, pinIdx * 2 + 1, rollerIdx * 2 + 1];
    const freeDOFs = [];
    for (let i = 0; i < dof; i++) {
      if (!fixedDOFs.includes(i)) freeDOFs.push(i);
    }

    const nFree = freeDOFs.length;
    let K_free = Array(nFree).fill(0).map(() => Array(nFree).fill(0));
    let F_free = Array(nFree).fill(0);

    for (let i = 0; i < nFree; i++) {
      F_free[i] = F[freeDOFs[i]];
      for (let j = 0; j < nFree; j++) {
        K_free[i][j] = K[freeDOFs[i]][freeDOFs[j]];
      }
    }

    const U_free = gaussianElimination(K_free, F_free);
    let U = Array(dof).fill(0);
    for (let i = 0; i < nFree; i++) {
      U[freeDOFs[i]] = U_free[i] || 0;
    }

    return members.map(m => {
      const n1 = nodes[m.n1];
      const n2 = nodes[m.n2];
      const dx = n2.x - n1.x;
      const dy = n2.y - n1.y;
      const L = Math.hypot(dx, dy);
      if (L === 0) return 0;
      const c = dx / L;
      const s = dy / L;

      const u1x = U[m.n1 * 2], u1y = U[m.n1 * 2 + 1];
      const u2x = U[m.n2 * 2], u2y = U[m.n2 * 2 + 1];

      const du_axial = (u2x - u1x) * c + (u2y - u1y) * s;
      return (EA / L) * du_axial; 
    });
  }

  function gaussianElimination(A, B) {
    const n = B.length;
    let M = A.map((row, i) => [...row, B[i]]);

    for (let i = 0; i < n; i++) {
      let maxRow = i;
      for (let k = i + 1; k < n; k++) {
        if (Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
      }
      [M[i], M[maxRow]] = [M[maxRow], M[i]];

      if (Math.abs(M[i][i]) < 1e-9) continue;

      for (let k = i + 1; k < n; k++) {
        let c = -M[k][i] / M[i][i];
        for (let j = i; j <= n; j++) {
          if (i === j) M[k][j] = 0;
          else M[k][j] += c * M[i][j];
        }
      }
    }

    let x = Array(n).fill(0);
    for (let i = n - 1; i >= 0; i--) {
      if (Math.abs(M[i][i]) < 1e-9) {
        x[i] = 0;
      } else {
        x[i] = M[i][n] / M[i][i];
        for (let k = i - 1; k >= 0; k--) {
          M[k][n] -= M[k][i] * x[i];
        }
      }
    }
    return x;
  }

  // Render Functions
  function renderSupports() {
    const preset = presets[currentPresetIdx];
    const pin = preset.nodes[preset.pinNode];
    const roller = preset.nodes[preset.rollerNode];
    const g = document.getElementById('supportsGroup');

    g.innerHTML = `
      <!-- Pin Support Left -->
      <polygon points="${pin.x},${pin.y} ${pin.x - 12},${pin.y + 22} ${pin.x + 12},${pin.y + 22}" fill="#64748b" stroke="#334155" stroke-width="2"/>
      <line x1="${pin.x - 20}" y1="${pin.y + 22}" x2="${pin.x + 20}" y2="${pin.y + 22}" stroke="#334155" stroke-width="3"/>

      <!-- Roller Support Right -->
      <polygon points="${roller.x},${roller.y} ${roller.x - 12},${roller.y + 16} ${roller.x + 12},${roller.y + 16}" fill="#64748b" stroke="#334155" stroke-width="2"/>
      <circle cx="${roller.x - 8}" cy="${roller.y + 20}" r="4" fill="#334155"/>
      <circle cx="${roller.x + 8}" cy="${roller.y + 20}" r="4" fill="#334155"/>
      <line x1="${roller.x - 20}" y1="${roller.y + 25}" x2="${roller.x + 20}" y2="${roller.y + 25}" stroke="#334155" stroke-width="2"/>
    `;
  }

  function render() {
    const preset = presets[currentPresetIdx];
    const activeLoadNode = preset.loadableNodes[loadNodeSelectIdx];
    const forces = solveTruss(preset.nodes, preset.members, preset.pinNode, preset.rollerNode, activeLoadNode, loadMagnitude);
    const maxForce = Math.max(...forces.map(Math.abs), 1);

    renderSupports();

    // 1. Render Members
    const membersGroup = document.getElementById('membersGroup');
    const labelsGroup = document.getElementById('labelsGroup');
    membersGroup.innerHTML = '';
    labelsGroup.innerHTML = '';

    preset.members.forEach((m, idx) => {
      const n1 = preset.nodes[m.n1];
      const n2 = preset.nodes[m.n2];
      const f = forces[idx];

      let strokeColor = '#94a3b8'; // Zero force
      if (f > 0.05) strokeColor = '#ef4444';      // Tension (+)
      else if (f < -0.05) strokeColor = '#2563eb'; // Compression (-)

      const strokeWidth = 2.5 + (Math.abs(f) / maxForce) * 3.5;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', n1.x);
      line.setAttribute('y1', n1.y);
      line.setAttribute('x2', n2.x);
      line.setAttribute('y2', n2.y);
      line.setAttribute('stroke', strokeColor);
      line.setAttribute('stroke-width', strokeWidth);
      line.setAttribute('stroke-linecap', 'round');
      line.classList.add('member-line');
      membersGroup.appendChild(line);

      // Labels
      const midX = (n1.x + n2.x) / 2;
      const midY = (n1.y + n2.y) / 2;

      let displayText = "";
      if (m.tag) displayText += `${m.tag}: `;
      displayText += `${Math.abs(f).toFixed(1)} kN`;

      if (showValues) {
        const boxWidth = displayText.length * 6.5 + 8;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', midX - boxWidth / 2);
        rect.setAttribute('y', midY - 9);
        rect.setAttribute('width', boxWidth);
        rect.setAttribute('height', 18);
        rect.classList.add('label-box');
        labelsGroup.appendChild(rect);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', midX);
        text.setAttribute('y', midY + 1);
        text.classList.add('member-label');
        text.textContent = displayText;
        labelsGroup.appendChild(text);
      }
    });

    // 2. Render Joint Nodes
    const nodesGroup = document.getElementById('nodesGroup');
    nodesGroup.innerHTML = '';
    preset.nodes.forEach((n, idx) => {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', n.x);
      circle.setAttribute('cy', n.y);
      circle.setAttribute('r', idx === activeLoadNode ? 6.5 : 4.5);
      circle.setAttribute('fill', idx === activeLoadNode ? '#d97706' : '#ffffff');
      circle.setAttribute('stroke', '#0f172a');
      circle.setAttribute('stroke-width', 2);
      nodesGroup.appendChild(circle);
    });

    // 3. Render Interactive Load Arrow
    const loadGroup = document.getElementById('loadGroup');
    loadGroup.innerHTML = '';

    if (loadMagnitude > 0) {
      const loadNode = preset.nodes[activeLoadNode];
      const arrowLength = 35 + (loadMagnitude / 100) * 35;
      const startY = loadNode.y;
      const endY = loadNode.y + arrowLength;

      const arrowLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      arrowLine.setAttribute('x1', loadNode.x);
      arrowLine.setAttribute('y1', startY);
      arrowLine.setAttribute('x2', loadNode.x);
      arrowLine.setAttribute('y2', endY);
      arrowLine.setAttribute('stroke', '#d97706');
      arrowLine.setAttribute('stroke-width', 5);
      arrowLine.setAttribute('marker-end', 'url(#arrowhead)');
      loadGroup.appendChild(arrowLine);

      const loadText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      loadText.setAttribute('x', loadNode.x);
      loadText.setAttribute('y', endY + 20);
      loadText.setAttribute('text-anchor', 'middle');
      loadText.setAttribute('fill', '#d97706');
      loadText.setAttribute('font-weight', 'bold');
      loadText.setAttribute('font-size', '13px');
      loadText.textContent = `${loadMagnitude} kN`;
      loadGroup.appendChild(loadText);
    }

    // Controls Update
    presetQuestion.textContent = preset.question;
    nodeVal.textContent = `Joint ${preset.nodes[activeLoadNode].label}`;
    magVal.textContent = `${loadMagnitude} kN`;
    nodeSelect.min = 0;
    nodeSelect.max = preset.loadableNodes.length - 1;
    nodeSelect.value = loadNodeSelectIdx;
    magSelect.value = loadMagnitude;
  }

  // Change preset logic
  function switchPreset(index) {
    currentPresetIdx = index;
    const preset = presets[currentPresetIdx];
    loadNodeSelectIdx = preset.defaultLoadNodeIdx;
    render();
  }

  // --- Interaction & Events ---
  presetSelect.addEventListener('change', (e) => {
    switchPreset(parseInt(e.target.value));
  });

  nodeSelect.addEventListener('input', (e) => {
    loadNodeSelectIdx = parseInt(e.target.value);
    render();
  });

  magSelect.addEventListener('input', (e) => {
    loadMagnitude = parseInt(e.target.value);
    render();
  });

  toggleValues.addEventListener('change', (e) => {
    showValues = e.target.checked;
    render();
  });

  resetBtn.addEventListener('click', () => {
    const preset = presets[currentPresetIdx];
    loadNodeSelectIdx = preset.defaultLoadNodeIdx;
    loadMagnitude = 50;
    showValues = true;
    toggleValues.checked = true;
    render();
  });

  function getSVGCoords(e) {
    const rect = svg.getBoundingClientRect();
    const scaleX = 800 / rect.width;
    const scaleY = 320 / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function handleStart(e) {
    isDragging = true;
    handleMove(e);
  }

  function handleMove(e) {
    if (!isDragging) return;
    const coords = getSVGCoords(e.touches ? e.touches[0] : e);
    const preset = presets[currentPresetIdx];

    // Find closest loadable node
    let closestSelectIdx = 0;
    let minDist = Infinity;
    preset.loadableNodes.forEach((nodeIdx, selIdx) => {
      const node = preset.nodes[nodeIdx];
      const dist = Math.abs(node.x - coords.x);
      if (dist < minDist) {
        minDist = dist;
        closestSelectIdx = selIdx;
      }
    });
    loadNodeSelectIdx = closestSelectIdx;

    // Magnitude adjustment via vertical drag
    const activeLoadNode = preset.nodes[preset.loadableNodes[loadNodeSelectIdx]];
    const dy = coords.y - activeLoadNode.y;
    if (dy > 10) {
      const calculatedMag = Math.min(100, Math.max(5, Math.round(((dy - 20) / 60) * 100)));
      loadMagnitude = calculatedMag;
    }

    render();
  }

  function handleEnd() {
    isDragging = false;
  }

  const loadGroup = document.getElementById('loadGroup');
  loadGroup.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);

  loadGroup.addEventListener('touchstart', handleStart, { passive: true });
  window.addEventListener('touchmove', handleMove, { passive: true });
  window.addEventListener('touchend', handleEnd);

  // Initialize Default
  switchPreset(3);
</script>
</body>
</html>
