<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Truss Analysis</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --tension-color: #ef4444;
      --compression-color: #2563eb;
      --zero-color: #94a3b8;
      --accent-color: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      background: var(--panel-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Control Panel */
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .checkbox-group {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 18px;
    }

    .checkbox-group input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-reset {
      grid-column: 1 / -1;
      justify-self: start;
      background: #1e293b;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset:hover {
      background: #334155;
    }

    /* SVG Canvas */
    .canvas-container {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Legend */
    .legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .load-arrow-group {
      cursor: grab;
    }

    .load-arrow-group:active {
      cursor: grabbing;
    }

    .member-line {
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }

    .member-label {
      font-size: 11px;
      font-weight: bold;
      fill: #1e293b;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .label-box {
      fill: #ffffff;
      stroke: #cbd5e1;
      stroke-width: 1;
      rx: 3;
    }

    .instruction-tip {
      font-size: 0.8rem;
      color: var(--accent-color);
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Interactive Truss Analysis Solver</h1>
    <p class="subtitle">Drag the orange arrow to shift the load location or adjust load magnitude.</p>
  </header>

  <!-- Control Panel -->
  <div class="controls">
    <div class="control-group">
      <label for="nodeSelect">Load Position: <span id="nodeVal">Joint B4</span></label>
      <input type="range" id="nodeSelect" min="0" max="6" value="4" step="1">
    </div>

    <div class="control-group">
      <label for="magSelect">Load Magnitude: <span id="magVal">50 kN</span></label>
      <input type="range" id="magSelect" min="0" max="100" value="50" step="5">
    </div>

    <div class="control-group checkbox-group">
      <input type="checkbox" id="toggleValues" checked>
      <label for="toggleValues" style="cursor:pointer;">Show Member Force Values</label>
    </div>

    <button class="btn-reset" id="resetBtn">Reset to Default</button>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" style="background: var(--tension-color);"></div>
      <span>Tension (+)</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background: var(--compression-color);"></div>
      <span>Compression (-)</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background: var(--zero-color);"></div>
      <span>Zero-Force (0)</span>
    </div>
  </div>

  <p class="instruction-tip">💡 Tip: You can drag the load arrow directly on the canvas below!</p>

  <!-- SVG Drawing Canvas -->
  <div class="canvas-container">
    <svg id="trussSvg" viewBox="0 0 800 320">
      <defs>
        <!-- Arrowhead Marker -->
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <polygon points="0 0, 8 4, 0 8" fill="#d97706" />
        </marker>
      </defs>
      
      <!-- Supports & Grid layer -->
      <g id="supportsGroup"></g>

      <!-- Truss Members Layer -->
      <g id="membersGroup"></g>

      <!-- Labels Layer -->
      <g id="labelsGroup"></g>

      <!-- Joint Nodes Layer -->
      <g id="nodesGroup"></g>

      <!-- Interactive Load Arrow Layer -->
      <g id="loadGroup" class="load-arrow-group"></g>
    </svg>
  </div>
</div>

<script>
  // --- Geometry Definition ---
  // Nodes (Coordinates in World Units)
  const nodes = [
    { id: 0, x: 100, y: 220, label: "B0" }, // Support Left (Pin)
    { id: 1, x: 200, y: 220, label: "B1" },
    { id: 2, x: 300, y: 220, label: "B2" },
    { id: 3, x: 400, y: 220, label: "B3" },
    { id: 4, x: 500, y: 220, label: "B4" },
    { id: 5, x: 600, y: 220, label: "B5" },
    { id: 6, x: 700, y: 220, label: "B6" }, // Support Right (Roller)
    { id: 7, x: 200, y: 90,  label: "T1" },
    { id: 8, x: 400, y: 90,  label: "T2" },
    { id: 9, x: 600, y: 90,  label: "T3" }
  ];

  // Truss Members (Connecting Nodes)
  const members = [
    // Bottom Chords
    { n1: 0, n2: 1, tag: "F1" },
    { n1: 1, n2: 2, tag: "F2" },
    { n1: 2, n2: 3, tag: "F4" },
    { n1: 3, n2: 4 },
    { n1: 4, n2: 5 },
    { n1: 5, n2: 6 },
    // Top Chords
    { n1: 7, n2: 8, tag: "F3" },
    { n1: 8, n2: 9 },
    // Verticals
    { n1: 1, n2: 7 },
    { n1: 3, n2: 8 },
    { n1: 5, n2: 9 },
    // Diagonals
    { n1: 0, n2: 7 },
    { n1: 7, n2: 2 },
    { n1: 2, n2: 8 },
    { n1: 8, n2: 4 },
    { n1: 4, n2: 9 },
    { n1: 9, n2: 6 }
  ];

  // Interactive State
  let activeLoadNode = 4; // Bottom joint B4
  let loadMagnitude = 50; // kN
  let showValues = true;
  let isDragging = false;

  // DOM Elements
  const nodeSelect = document.getElementById('nodeSelect');
  const magSelect = document.getElementById('magSelect');
  const nodeVal = document.getElementById('nodeVal');
  const magVal = document.getElementById('magVal');
  const toggleValues = document.getElementById('toggleValues');
  const resetBtn = document.getElementById('resetBtn');
  const svg = document.getElementById('trussSvg');

  // Matrix Structural Solver (2D Direct Stiffness Method)
  function solveTruss(loadNodeIdx, loadMag) {
    const numNodes = nodes.length;
    const dof = numNodes * 2;
    let K = Array(dof).fill(0).map(() => Array(dof).fill(0));
    let F = Array(dof).fill(0);

    // Apply vertical downward load (Y axis point down in SVG)
    if (loadNodeIdx >= 0 && loadNodeIdx < 7) {
      F[loadNodeIdx * 2 + 1] = loadMag; 
    }

    const EA = 1e6; // Elastic modulus * Area constant

    // Assemble Global Stiffness Matrix
    members.forEach(m => {
      const n1 = nodes[m.n1];
      const n2 = nodes[m.n2];
      const dx = n2.x - n1.x;
      const dy = n2.y - n1.y;
      const L = Math.hypot(dx, dy);
      const c = dx / L;
      const s = dy / L;

      const k_local = [
        [ c*c,  c*s, -c*c, -c*s],
        [ c*s,  s*s, -c*s, -s*s],
        [-c*c, -c*s,  c*c,  c*s],
        [-c*s, -s*s,  c*s,  s*s]
      ];

      const map = [m.n1*2, m.n1*2+1, m.n2*2, m.n2*2+1];
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          K[map[i]][map[j]] += (EA / L) * k_local[i][j];
        }
      }
    });

    // Boundary Conditions: 
    // Node 0 (B0): Fixed X, Y (DOFs 0, 1)
    // Node 6 (B6): Roller (Fixed Y, DOF 13)
    const fixedDOFs = [0, 1, 13];
    const freeDOFs = [];
    for (let i = 0; i < dof; i++) {
      if (!fixedDOFs.includes(i)) freeDOFs.push(i);
    }

    const nFree = freeDOFs.length;
    let K_free = Array(nFree).fill(0).map(() => Array(nFree).fill(0));
    let F_free = Array(nFree).fill(0);

    for (let i = 0; i < nFree; i++) {
      F_free[i] = F[freeDOFs[i]];
      for (let j = 0; j < nFree; j++) {
        K_free[i][j] = K[freeDOFs[i]][freeDOFs[j]];
      }
    }

    // Solve matrix system
    const U_free = gaussianElimination(K_free, F_free);
    let U = Array(dof).fill(0);
    for (let i = 0; i < nFree; i++) {
      U[freeDOFs[i]] = U_free[i];
    }

    // Compute Axial Forces for each member
    return members.map(m => {
      const n1 = nodes[m.n1];
      const n2 = nodes[m.n2];
      const dx = n2.x - n1.x;
      const dy = n2.y - n1.y;
      const L = Math.hypot(dx, dy);
      const c = dx / L;
      const s = dy / L;

      const u1x = U[m.n1 * 2], u1y = U[m.n1 * 2 + 1];
      const u2x = U[m.n2 * 2], u2y = U[m.n2 * 2 + 1];

      const du_axial = (u2x - u1x) * c + (u2y - u1y) * s;
      let force = (EA / L) * du_axial;
      
      // Tension (+) / Compression (-)
      // Note: In SVG downward movement is +Y, invert sign for structural conventions
      return -force; 
    });
  }

  // Gaussian Elimination Solver
  function gaussianElimination(A, B) {
    const n = B.length;
    let M = A.map((row, i) => [...row, B[i]]);

    for (let i = 0; i < n; i++) {
      let maxRow = i;
      for (let k = i + 1; k < n; k++) {
        if (Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
      }
      [M[i], M[maxRow]] = [M[maxRow], M[i]];

      if (Math.abs(M[i][i]) < 1e-9) continue;

      for (let k = i + 1; k < n; k++) {
        let c = -M[k][i] / M[i][i];
        for (let j = i; j <= n; j++) {
          if (i === j) M[k][j] = 0;
          else M[k][j] += c * M[i][j];
        }
      }
    }

    let x = Array(n).fill(0);
    for (let i = n - 1; i >= 0; i--) {
      x[i] = M[i][n] / M[i][i];
      for (let k = i - 1; k >= 0; k--) {
        M[k][n] -= M[k][i] * x[i];
      }
    }
    return x;
  }

  // --- Rendering Functions ---
  function renderSupports() {
    const g = document.getElementById('supportsGroup');
    g.innerHTML = `
      <!-- Pin Support Left (Node 0) -->
      <polygon points="100,220 88,242 112,242" fill="#64748b" stroke="#334155" stroke-width="2"/>
      <line x1="80" y1="242" x2="120" y2="242" stroke="#334155" stroke-width="3"/>

      <!-- Roller Support Right (Node 6) -->
      <polygon points="700,220 688,236 712,236" fill="#64748b" stroke="#334155" stroke-width="2"/>
      <circle cx="692" cy="240" r="4" fill="#334155"/>
      <circle cx="708" cy="240" r="4" fill="#334155"/>
      <line x1="680" y1="245" x2="720" y2="245" stroke="#334155" stroke-width="2"/>
    `;
  }

  function render() {
    const forces = solveTruss(activeLoadNode, loadMagnitude);
    const maxForce = Math.max(...forces.map(Math.abs), 1);

    // 1. Render Members
    const membersGroup = document.getElementById('membersGroup');
    const labelsGroup = document.getElementById('labelsGroup');
    membersGroup.innerHTML = '';
    labelsGroup.innerHTML = '';

    members.forEach((m, idx) => {
      const n1 = nodes[m.n1];
      const n2 = nodes[m.n2];
      const f = forces[idx];

      let strokeColor = '#94a3b8'; // Zero force
      if (f > 0.01) strokeColor = '#ef4444';      // Tension
      else if (f < -0.01) strokeColor = '#2563eb'; // Compression

      // Dynamic line width based on force magnitude
      const strokeWidth = 2.5 + (Math.abs(f) / maxForce) * 3.5;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', n1.x);
      line.setAttribute('y1', n1.y);
      line.setAttribute('x2', n2.x);
      line.setAttribute('y2', n2.y);
      line.setAttribute('stroke', strokeColor);
      line.setAttribute('stroke-width', strokeWidth);
      line.setAttribute('stroke-linecap', 'round');
      line.classList.add('member-line');
      membersGroup.appendChild(line);

      // Member Text Labels
      const midX = (n1.x + n2.x) / 2;
      const midY = (n1.y + n2.y) / 2;

      let displayText = "";
      if (m.tag) displayText += `${m.tag}: `;
      displayText += `${Math.abs(f).toFixed(1)} kN`;

      if (showValues) {
        const boxWidth = displayText.length * 6.5 + 8;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', midX - boxWidth / 2);
        rect.setAttribute('y', midY - 9);
        rect.setAttribute('width', boxWidth);
        rect.setAttribute('height', 18);
        rect.classList.add('label-box');
        labelsGroup.appendChild(rect);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', midX);
        text.setAttribute('y', midY + 1);
        text.classList.add('member-label');
        text.textContent = displayText;
        labelsGroup.appendChild(text);
      }
    });

    // 2. Render Joint Nodes
    const nodesGroup = document.getElementById('nodesGroup');
    nodesGroup.innerHTML = '';
    nodes.forEach((n, idx) => {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', n.x);
      circle.setAttribute('cy', n.y);
      circle.setAttribute('r', idx === activeLoadNode ? 6 : 4.5);
      circle.setAttribute('fill', idx === activeLoadNode ? '#d97706' : '#ffffff');
      circle.setAttribute('stroke', '#0f172a');
      circle.setAttribute('stroke-width', 2);
      nodesGroup.appendChild(circle);
    });

    // 3. Render Interactive Load Arrow
    const loadGroup = document.getElementById('loadGroup');
    loadGroup.innerHTML = '';

    if (loadMagnitude > 0) {
      const loadNode = nodes[activeLoadNode];
      const arrowLength = 35 + (loadMagnitude / 100) * 35;
      const startY = loadNode.y;
      const endY = loadNode.y + arrowLength;

      // Shaft Line
      const arrowLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      arrowLine.setAttribute('x1', loadNode.x);
      arrowLine.setAttribute('y1', startY);
      arrowLine.setAttribute('x2', loadNode.x);
      arrowLine.setAttribute('y2', endY);
      arrowLine.setAttribute('stroke', '#d97706');
      arrowLine.setAttribute('stroke-width', 5);
      arrowLine.setAttribute('marker-end', 'url(#arrowhead)');
      loadGroup.appendChild(arrowLine);

      // Load Value Tag
      const loadText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      loadText.setAttribute('x', loadNode.x);
      loadText.setAttribute('y', endY + 20);
      loadText.setAttribute('text-anchor', 'middle');
      loadText.setAttribute('fill', '#d97706');
      loadText.setAttribute('font-weight', 'bold');
      loadText.setAttribute('font-size', '13px');
      loadText.textContent = `${loadMagnitude} kN`;
      loadGroup.appendChild(loadText);
    }

    // UI Updates
    nodeVal.textContent = nodes[activeLoadNode].label;
    magVal.textContent = `${loadMagnitude} kN`;
    nodeSelect.value = activeLoadNode;
    magSelect.value = loadMagnitude;
  }

  // --- Interaction & Event Handlers ---
  nodeSelect.addEventListener('input', (e) => {
    activeLoadNode = parseInt(e.target.value);
    render();
  });

  magSelect.addEventListener('input', (e) => {
    loadMagnitude = parseInt(e.target.value);
    render();
  });

  toggleValues.addEventListener('change', (e) => {
    showValues = e.target.checked;
    render();
  });

  resetBtn.addEventListener('click', () => {
    activeLoadNode = 4;
    loadMagnitude = 50;
    showValues = true;
    toggleValues.checked = true;
    render();
  });

  // Dragging interaction logic on SVG
  function getSVGCoords(e) {
    const rect = svg.getBoundingClientRect();
    const scaleX = 800 / rect.width;
    const scaleY = 320 / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function handleStart(e) {
    isDragging = true;
    handleMove(e);
  }

  function handleMove(e) {
    if (!isDragging) return;
    const coords = getSVGCoords(e.touches ? e.touches[0] : e);

    // Find closest bottom chord node (Nodes 0 to 6)
    let closestNodeIdx = 0;
    let minDist = Infinity;
    for (let i = 0; i < 7; i++) {
      const dist = Math.abs(nodes[i].x - coords.x);
      if (dist < minDist) {
        minDist = dist;
        closestNodeIdx = i;
      }
    }
    activeLoadNode = closestNodeIdx;

    // Adjust load magnitude via vertical dragging
    const loadNode = nodes[activeLoadNode];
    const dy = coords.y - loadNode.y;
    if (dy > 10) {
      const calculatedMag = Math.min(100, Math.max(5, Math.round(((dy - 20) / 60) * 100)));
      loadMagnitude = calculatedMag;
    }

    render();
  }

  function handleEnd() {
    isDragging = false;
  }

  const loadGroup = document.getElementById('loadGroup');
  loadGroup.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);

  loadGroup.addEventListener('touchstart', handleStart, { passive: true });
  window.addEventListener('touchmove', handleMove, { passive: true });
  window.addEventListener('touchend', handleEnd);

  // Initialize
  renderSupports();
  render();
</script>
</body>
</html>
